<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Doomsday Countdown — Pinterest Pin</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@500;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--ink:#1a0f55;--cyan:#46d9ff;--vio:#8b5cff;--mag:#ff3fa4;--coral:#ff8a4c;--em:#35e29a;--gold:#ffd25a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#241470}
body{display:grid;place-items:center;overflow:hidden;font-family:'DM Sans',system-ui,sans-serif}
.pin{position:relative;width:min(100vw,calc(100svh*2/3));aspect-ratio:2/3;container-type:inline-size;overflow:hidden;background:#3a1a8c}
canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.abs{position:absolute;left:0;right:0;text-align:center}
.top{top:3.6cqw;font:400 3cqw 'Press Start 2P',monospace;color:#fff;letter-spacing:.12em;text-shadow:0 .5cqw 0 var(--ink),0 0 3cqw rgba(70,217,255,.9)}
.top::before,.top::after{content:"";display:inline-block;width:3cqw;height:3cqw;background:var(--gold);margin:0 2.4cqw;vertical-align:-.3cqw;box-shadow:0 0 2cqw var(--gold)}
.hl{top:62.5cqw;font:400 22cqw/.84 'Bebas Neue',Oswald,Impact,sans-serif;letter-spacing:.02em}
.hl span{display:block;background:linear-gradient(180deg,#fff6c4 5%,var(--gold) 38%,var(--coral) 68%,var(--mag));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(.7cqw 0 0 var(--ink)) drop-shadow(-.7cqw 0 0 var(--ink)) drop-shadow(0 .7cqw 0 var(--ink)) drop-shadow(0 -.5cqw 0 var(--ink)) drop-shadow(0 1.6cqw 2.4cqw rgba(26,15,85,.75))}
.sup{top:102.5cqw}
.sup b{display:inline-block;font:700 4.6cqw 'DM Sans',sans-serif;letter-spacing:.2em;color:#fff;background:linear-gradient(100deg,var(--mag),var(--vio));padding:1.5cqw 4.5cqw;box-shadow:0 .8cqw 0 var(--ink),0 0 3cqw rgba(255,63,164,.6);clip-path:polygon(0 1cqw,1cqw 0,100% 0,100% calc(100% - 1cqw),calc(100% - 1cqw) 100%,0 100%)}
.tt{position:absolute;left:10cqw;right:10cqw;top:111.5cqw;height:21cqw;background:rgba(26,15,85,.9);border:.5cqw solid var(--cyan);box-shadow:0 0 3cqw rgba(70,217,255,.6),0 1cqw 0 var(--ink);padding:1.6cqw 2.2cqw}
.tt h4{margin:0 0 1.2cqw;font:400 2.5cqw 'Press Start 2P',monospace;color:var(--em);letter-spacing:.1em}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:.9cqw}
.grid i{height:3.5cqw;background:var(--c);position:relative;opacity:.95}
.grid i.o{background:transparent;border:.35cqw solid var(--c);opacity:.75}
.grid i.d::after{content:"";position:absolute;left:50%;top:50%;width:.8cqw;height:1.6cqw;border:solid #0b2a1f;border-width:0 .45cqw .45cqw 0;transform:translate(-50%,-62%) rotate(45deg)}
.pb{margin-top:1.4cqw;height:1.6cqw;background:rgba(255,255,255,.14)}.pb i{display:block;width:46%;height:100%;background:linear-gradient(90deg,var(--mag),var(--gold),var(--em))}
.feat{position:absolute;left:3cqw;right:3cqw;top:136.5cqw;display:grid;grid-template-columns:repeat(3,1fr);gap:1.6cqw}
.feat div{background:var(--ink);border:.4cqw solid var(--c);color:#fff;font:700 2.75cqw 'DM Sans',sans-serif;letter-spacing:.04em;text-align:center;padding:1.7cqw .6cqw 1.7cqw;box-shadow:0 .7cqw 0 rgba(26,15,85,.8),0 0 2.2cqw color-mix(in srgb,var(--c) 55%,transparent)}
.feat div::before{content:"";display:block;width:2.2cqw;height:2.2cqw;background:var(--c);margin:0 auto 1.1cqw;box-shadow:0 0 1.6cqw var(--c)}
.fine{bottom:1.2cqw;font:500 1.9cqw 'DM Sans',sans-serif;color:#fff;opacity:.85;text-shadow:0 .2cqw 0 var(--ink)}
</style>
</head>
<body>
<main class="pin" id="pin">
  <canvas id="art" width="300" height="450" aria-hidden="true"></canvas>
  <div class="abs top">MCU FANS — GET READY</div>
  <h1 class="abs hl" style="margin:0"><span>DOOMSDAY</span><span>COUNTDOWN</span></h1>
  <div class="abs sup"><b>YOUR MCU WATCH PLAN</b></div>
  <div class="tt" aria-hidden="true"><h4>YOUR TIMETABLE</h4>
    <div class="grid" id="grid"></div><div class="pb"><i></i></div></div>
  <div class="feat"><div style="--c:var(--cyan)">WATCH ORDER</div><div style="--c:var(--gold)">TRACK PROGRESS</div><div style="--c:var(--mag)">PLAN YOUR WATCH</div></div>
  <div class="abs fine">Independent fan-made planner. Not affiliated with Marvel or Disney.</div>
</main>
<script>
(function(){
var P=['#46d9ff','#8b5cff','#ff3fa4','#ff8a4c','#35e29a','#ffd25a'];
// timetable preview cells (decorative colour blocks)
var g=document.getElementById('grid'),pat='dddooddodooodoooddooo';
for(var i=0;i<21;i++){var e=document.createElement('i');e.style.setProperty('--c',P[(i*2+(i/7|0))%6]);if(pat[i]=='d')e.className='d';else if(pat[i]=='o')e.className='o';g.appendChild(e)}

var c=document.getElementById('art'),x=c.getContext('2d'),W=300,H=450,rd=matchMedia('(prefers-reduced-motion: reduce)').matches;
x.imageSmoothingEnabled=false;
// seeded random so the artwork is identical on every load
var seed=7;function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647}
var stars=[];for(var i=0;i<120;i++)stars.push({x:rnd()*W,y:rnd()*H*.62,p:rnd()*6,c:P[rnd()*6|0],s:rnd()<.15?2:1});
function R(a,b,w,h,col){x.fillStyle=col;x.fillRect(a|0,b|0,w,h)}
function island(cx,cy,w,t,ph){var h=Math.round(w*.6),by=cy+(rd?0:Math.sin(t/900+ph)*1.5);
 for(var i=0;i<h;i++){var ww=Math.round(w*(1-i/h*.85));R(cx-ww/2,by+i,ww,1,i<2?(i?'#35e29a':'#9dffd2'):(i<h*.5?'#7a52d8':'#4a3299'))}
 R(cx-w*.22,by-5,2,5,'#46d9ff');R(cx-w*.22+3,by-8,2,8,'#ff3fa4');R(cx+w*.18,by-4,2,4,'#ffd25a');
 R(cx-2,by+h+2,4,1,'rgba(255,138,76,.9)');R(cx-1,by+h+4,2,1,'rgba(255,138,76,.6)')}
var SP=['..........g','.....g...a#','......g..##','.......a###','.......####','.......#mm#','.......####','........###','..aaaa.####','.a######a##','.a#########','.a####a###g','.a####a####','..a###a####','..a########','..a..a#####','..a..a#####','..#..a##a##','..#...#####','..#...#a###','..a...#####','.......####','......#####','......#a###','......#####','......#####','......##a##','.....######','....#######','....aaaaaaa'],SC={'#':'#2a1d80','a':'#46d9ff','g':'#ffd25a','m':'#ff3fa4'};
function draw(t){
 var cx=150,cy=105,Rr=62;
 var g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#17186a');g.addColorStop(.3,'#3f1fa8');g.addColorStop(.62,'#9a2aa6');g.addColorStop(1,'#ff6f8f');x.fillStyle=g;x.fillRect(0,0,W,H);
 stars.forEach(function(s){x.globalAlpha=rd?.8:.45+.5*Math.sin(t/600+s.p);R(s.x,s.y,s.s,s.s,s.c)});x.globalAlpha=1;
 // light rays
 x.save();x.translate(cx,cy);x.rotate(rd?0:t/9000);
 for(var i=0;i<14;i++){x.rotate(6.2832/14);x.fillStyle=i%2?'rgba(255,210,90,.10)':'rgba(70,217,255,.08)';x.beginPath();x.moveTo(0,0);x.lineTo(-14,-300);x.lineTo(14,-300);x.fill()}x.restore();
 var gl=x.createRadialGradient(cx,cy,0,cx,cy,Rr*2.3);gl.addColorStop(0,'rgba(255,235,160,.9)');gl.addColorStop(.25,'rgba(255,63,164,.55)');gl.addColorStop(.6,'rgba(110,60,255,.3)');gl.addColorStop(1,'rgba(70,217,255,0)');x.fillStyle=gl;x.fillRect(0,0,W,H);
 island(34,62,40,t,0);island(268,48,32,t,1.3);island(252,150,26,t,2.1);island(46,160,22,t,3);island(150,24,14,t,4);
 var dg=x.createRadialGradient(cx,cy,0,cx,cy,Rr);dg.addColorStop(0,'#fff6c8');dg.addColorStop(.3,'#ff8a4c');dg.addColorStop(.62,'#7a2cff');dg.addColorStop(1,'#2a1480');
 x.fillStyle=dg;x.beginPath();x.ellipse(cx,cy,Rr*.88,Rr*1.04,0,0,6.2832);x.fill();
 for(var r=0;r<10;r++){var rad=Rr*(1.06-r*.09),dir=r%2?-1:1,n=Math.floor(rad*6.2),big=r<4?2:1;
  for(var k=0;k<n;k++){var a=k/n*6.2832+(rd?r:t/(1800-r*70))*dir,w=Math.sin(a*3+r)*1.5;
   x.fillStyle=P[(r+((k/7)|0))%6];x.fillRect((cx+Math.cos(a)*(rad*.88+w))|0,(cy+Math.sin(a)*(rad*1.04+w))|0,big,big)}}
 // sparks
 for(var i=0;i<46;i++){var a=rnd()*6.2832,d=Rr*(.9+rnd()*.9);R(cx+Math.cos(a)*d,cy+Math.sin(a)*d*1.1,2,2,P[i%6])}
 // silhouette
 var k=2,sw=21*k,sx=cx-sw/2,by=186,sTop=by-30*k;
 for(var row=8;row<30;row++){var fl=Math.round((row-8)*.14);R(sx+3*k-fl,sTop+row*k,15*k+fl*2,k,row%4<2?'#8b5cff':'#d02aa4')}
 for(var row=0;row<30;row++){var s=SP[row];for(var col=0;col<11;col++){var ch=s[col];if(ch!=='.'){R(sx+col*k,sTop+row*k,k,k,SC[ch]);if(col<10)R(sx+(20-col)*k,sTop+row*k,k,k,SC[ch])}}}
 var pw=100,ph=22;for(var i=0;i<ph;i++){var w2=Math.round(pw*(1-i/ph*.8));R(cx-w2/2,by+i,w2,1,i<2?(i?'#35e29a':'#9dffd2'):(i<ph*.5?'#7a52d8':'#4a3299'))}
 R(cx-pw/2,by-1,pw,1,'rgba(255,210,90,.6)');
 if(!rd)requestAnimationFrame(draw)}
// reset the seed every frame so the sparks stay in place
var base=draw;
draw=function(t){seed=11;base(t)};
requestAnimationFrame(draw);
})();
</script>
</body>
</html>
